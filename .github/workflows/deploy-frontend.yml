name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify guided demo assets are present
        run: |
          test -f "public/assets/gen-ai/feel-the-rhythm-now-version-1.mp3"
          test -f "public/assets/gen-ai/hearts-are-golden.mp3"
          test -f "public/assets/drumbreaks/Fat Snare Natural Tape Compression I.m4a"
          test -f "public/assets/drumbreaks/Fat Snare Natural Tape Compression II.m4a"

      - name: Build for production
        run: npm run build:production
        env:
          VITE_APP_ENV: production
          # Ignore any repo .env / machine VITE_API_BASE_URL; use config/production.json (+ /api) via vite.config.js
          VITE_API_BASE_URL: ""

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy dist --project-name=audafact-web-prod --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
