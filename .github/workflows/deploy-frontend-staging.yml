name: Deploy Frontend to Staging

on:
  push:
    branches:
      - develop
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify guided demo assets are present
        run: |
          test -f "public/assets/gen-ai/feel-the-rhythm-now-version-1.mp3"
          test -f "public/assets/gen-ai/hearts-are-golden.mp3"
          test -f "public/assets/drumbreaks/Fat Snare Natural Tape Compression I.m4a"
          test -f "public/assets/drumbreaks/Fat Snare Natural Tape Compression II.m4a"

      - name: Build for staging
        run: npm run build:staging
        env:
          VITE_APP_ENV: staging
          # Ignore repo/.env localhost; vite.config resolves apiUrl from staging env config
          VITE_API_BASE_URL: ""
          # Optional: set in GitHub → Settings → Secrets and variables → Actions → Variables
          # VITE_DEBUG_API_BASE=true → [Audafact API base] step logs + keeps console in bundle (see vite.config.js)
          # VITE_KEEP_CONSOLE=true → keep all console.* without verbose API logs (or use both for full debug)
          VITE_DEBUG_API_BASE: ${{ vars.VITE_DEBUG_API_BASE }}
          VITE_KEEP_CONSOLE: ${{ vars.VITE_KEEP_CONSOLE }}

      - name: Deploy to Cloudflare Pages (Staging)
        run: wrangler pages deploy dist --project-name=audafact-web-staging --branch develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
